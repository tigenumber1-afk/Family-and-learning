function challengeWord(){var idx=Math.floor(Math.random()*items.length),x=items[idx],word=x[1],answer=x[0],shown='ـ'+word.slice(1),opts=[answer];while(opts.length<3){var y=items[Math.floor(Math.random()*items.length)][0];if(opts.indexOf(y)<0)opts.push(y);}opts.sort(function(){return Math.random()-.5});content.innerHTML='<div id="akxQuiz"><div style="font-size:22px;font-weight:900">🔤 اختر الحرف الأول</div><div style="font-size:38px;font-weight:900;color:#1976d2;margin:14px">'+shown+'</div><div style="font-size:18px;font-weight:800">أي حرف يبدأ به اسم الحيوان؟ '+x[2]+'</div>'+opts.map(function(o){return '<button class="akxChoice" data-cw="'+o+'">'+o+'</button>';}).join('')+'<div id="cm" style="margin:12px;font-weight:900"></div></div>';content.querySelectorAll('[data-cw]').forEach(function(b){b.onclick=function(){var m=content.querySelector('#cm');if(b.dataset.cw===answer){m.textContent='🎉 ممتاز! + نجمة';m.style.color='#2e7d32';addStar(1);markLearned(idx);progress();}else{m.textContent='جرّب مرة أخرى 😊';m.style.color='#e65100';}}});speak(answer+'، '+word);} 
function challengeSound(){var idx=Math.floor(Math.random()*items.length),x=items[idx],opts=[x];while(opts.length<4){var y=items[Math.floor(Math.random()*items.length)];if(opts.indexOf(y)<0)opts.push(y);}opts.sort(function(){return Math.random()-.5});content.innerHTML='<div id="akxQuiz"><div style="font-size:22px;font-weight:900">🔊 ما الحرف الذي سمعته؟</div><button class="akxBtn akxBlue" id="playSound">تشغيل الصوت</button><div>'+opts.map(function(y){return '<button class="akxChoice" data-cs="'+items.indexOf(y)+'">'+y[0]+' '+y[2]+'</button>';}).join('')+'</div><div id="sm" style="margin:12px;font-weight:900"></div></div>';content.querySelector('#playSound').onclick=function(){speak(x[0]+'، '+x[1])};content.querySelectorAll('[data-cs]').forEach(function(b){b.onclick=function(){var m=content.querySelector('#sm');if(+b.dataset.cs===idx){m.textContent='🎉 أحسنت! + نجمة';m.style.color='#2e7d32';addStar(1);markLearned(idx);progress();}else{m.textContent='استمع مرة أخرى وحاول 😊';m.style.color='#e65100';}}});speak(x[0]+'، '+x[1]);}
function challengeMemory(){var base=[Math.floor(Math.random()*items.length)];while(base.length<2){var n=Math.floor(Math.random()*items.length);if(base.indexOf(n)<0)base.push(n);}var cards=[];base.forEach(function(i){cards.push({type:'letter',i:i,text:items[i][0]});cards.push({type:'animal',i:i,text:items[i][2]});});cards.sort(function(){return Math.random()-.5});var first=null,locked=false,matches=0;content.innerHTML='<div id="akxQuiz"><div style="font-size:22px;font-weight:900">🧠 طابق الحرف مع الحيوان</div><div class="akxMemoryGrid">'+cards.map(function(c,i){return '<button class="akxMemory" data-mi="'+i+'">❓</button>';}).join('')+'</div><div id="mm" style="font-weight:900"></div></div>';content.querySelectorAll('[data-mi]').forEach(function(b,i){b.onclick=function(){if(locked||b.classList.contains('revealed'))return;var c=cards[i];b.textContent=c.text;b.classList.add('revealed');if(first===null){first={i:i,c:c,b:b};return;}locked=true;if(first.c.i===c.i&&first.c.type!==c.type){matches++;b.style.background='#e8f5e9';first.b.style.background='#e8f5e9';first=null;locked=false;if(matches===base.length){content.querySelector('#mm').textContent='🏆 رائع! اكتملت المطابقة + نجمتان';addStar(2);base.forEach(markLearned);progress();}}else{setTimeout(function(){b.textContent='❓';first.b.textContent='❓';b.classList.remove('revealed');first.b.classList.remove('revealed');first=null;locked=false;},650);}}});}
function renderBadges(){var list=[['🌱','أول خطوة','تعلم حرفًا واحدًا',learned.length>=1],['🔤','عاشق الحروف','تعلم 10 حروف',learned.length>=10],['🦁','مستكشف','تعلم 20 حرفًا',learned.length>=20],['👑','بطل الحروف','تعلم كل الحروف',learned.length>=28],['⭐','جامع النجوم','اجمع 10 نجوم',stars>=10],['🔥','مواظب','نشاط لمدة يومين متتاليين',streak()>=2],['🏆','نجم التحديات','اجمع 25 نجمة',stars>=25],['💎','سيد التعلم','اجمع 50 نجمة',stars>=50]];content.innerHTML='<div style="text-align:center;font-size:22px;font-weight:900;color:#075b96;margin-bottom:12px">🏅 إنجازاتك</div><div>'+list.map(function(b){return '<div class="akxBadge" style="display:block;text-align:right;margin:7px 0;opacity:'+(b[3]?'1':'.45')+'">'+b[0]+' <strong>'+b[1]+'</strong><br><small>'+b[2]+'</small> '+(b[3]?'✅':'🔒')+'</div>';}).join('')+'</div>';}
function parentGate(){ parentA=2+Math.floor(Math.random()*8); parentB=2+Math.floor(Math.random()*8); content.innerHTML='<div class="akxParent"><div style="font-size:24px;font-weight:900;color:#8d6e00">👨‍👩‍👧 منطقة الأهل</div><p style="font-weight:800">للحفاظ على إعدادات الطفل، أجب عن السؤال البسيط التالي:</p><div style="font-size:34px;font-weight:900;margin:16px">'+parentA+' + '+parentB+' = ؟</div><input id="parentAnswer" inputmode="numeric" type="number" aria-label="إجابة سؤال الأهل" style="font-size:24px;text-align:center;width:150px;padding:9px;border:2px solid #ffe082;border-radius:12px"><br><button id="parentEnter" class="akxBtn akxGold" style="margin-top:10px">دخول</button><div id="parentMsg" style="margin-top:10px;font-weight:900"></div></div>'; content.querySelector('#parentAnswer').focus(); content.querySelector('#parentEnter').onclick=function(){var v=Number(content.querySelector('#parentAnswer').value);var m=content.querySelector('#parentMsg');if(v===parentA+parentB){parentUnlocked=true;renderParent();}else{m.textContent='الإجابة غير صحيحة، حاول مرة أخرى.';m.style.color='#e65100';parentGate();}};}
  function backupData(){return JSON.stringify({app:'ArabicKidsIndependent',version:'2.2.0',exportedAt:new Date().toISOString(),fav:fav,learned:learned,stars:stars,daily:daily,soundOn:soundOn});}
  function shareBackup(){if(window.AndroidTTS&&AndroidTTS.shareBackup){AndroidTTS.shareBackup(backupData());}else{var t=backupData();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('تم نسخ النسخة الاحتياطية. يمكنك حفظها في مكان آمن.');});}else{alert(t);}}}
  function restoreBackup(){if(window.AndroidTTS&&AndroidTTS.pickBackup){AndroidTTS.pickBackup();return;}var raw=prompt('الصق بيانات النسخة الاحتياطية هنا:');if(!raw)return;applyBackup(raw);} function restoreBackupFromAndroid(raw){applyBackup(raw);} function restoreBackupError(){alert('تعذر قراءة ملف النسخة الاحتياطية.');} function applyBackup(raw){try{var d=JSON.parse(raw);if(!d||d.app!=='ArabicKidsIndependent'||!Array.isArray(d.learned)||!Array.isArray(d.fav))throw new Error('bad');var cleanLearned=d.learned.filter(function(i){return Number.isInteger(i)&&i>=0&&i<items.length;});var cleanFav=d.fav.filter(function(i){return Number.isInteger(i)&&i>=0&&i<items.length;});var cleanDaily={};if(d.daily&&typeof d.daily==='object'&&!Array.isArray(d.daily)){Object.keys(d.daily).slice(-180).forEach(function(k){if(/^\d{4}-\d{2}-\d{2}$/.test(k)){var n=Math.max(0,Math.min(999,Number(d.daily[k])||0));cleanDaily[k]=n;}});}learned=Array.from(new Set(cleanLearned));fav=Array.from(new Set(cleanFav));stars=Math.max(0,Math.min(99999,Math.floor(Number(d.stars)||0)));daily=cleanDaily;soundOn=d.soundOn!==false;save();alert('تمت استعادة التقدم بنجاح ✅');render();}catch(e){alert('النسخة الاحتياطية غير صالحة أو تالفة.');}}
  function renderParent(){ if(!parentUnlocked){parentGate();return;} content.innerHTML='<div class="akxParent"><div style="font-size:23px;font-weight:900;color:#8d6e00">👨‍👩‍👧 لوحة الأهل</div><p>إحصاءات هذا الجهاز محفوظة محليًا ولا تحتاج إلى حساب.</p><div style="font-size:18px;font-weight:800;line-height:1.9">'+level()+'<br>تعلم: '+learned.length+'/'+items.length+'<br>النجوم: '+stars+'<br>نجوم اليوم: '+(daily[today()]||0)+'<br>🔥 أيام متتالية: '+streak()+'</div><button id="akxSound" class="akxBtn akxBlue">'+(soundOn?'🔊 الصوت: تشغيل':'🔇 الصوت: إيقاف')+'</button><button id="akxReset" class="akxBtn akxRed">إعادة التقدم</button><button id="akxBackup" class="akxBtn akxGreen">💾 مشاركة نسخة احتياطية</button><button id="akxRestore" class="akxBtn akxBlue">♻️ استعادة نسخة</button><button id="akxLock" class="akxBtn" style="background:#eceff1;color:#37474f">🔒 قفل لوحة الأهل</button></div>'; content.querySelector('#akxSound').onclick=function(){soundOn=!soundOn;save();renderParent();}; content.querySelector('#akxBackup').onclick=function(){shareBackup();}; content.querySelector('#akxRestore').onclick=function(){restoreBackup();}; content.querySelector('#akxLock').onclick=function(){parentUnlocked=false;renderParent();}; content.querySelector('#akxReset').onclick=function(){if(confirm('هل تريد حذف التقدم والنجوم والمفضلة من هذا الجهاز؟')){fav=[];learned=[];stars=0;daily={};save();render();}};}
  var levelGroups=[{name:'🌱 البداية',desc:'الحروف من أ إلى خ',start:0,end:7},{name:'🌿 المتقدم',desc:'الحروف من د إلى ض',start:7,end:15},{name:'🌳 المستكشف',desc:'الحروف من ط إلى ق',start:15,end:22},{name:'👑 البطل',desc:'الحروف من ك إلى ي',start:22,end:28}];
  function levelUnlocked(g){return g.start===0||learned.length>=g.start;}
  function renderLevels(){content.innerHTML='<div style="text-align:center;font-size:21px;font-weight:900;color:#075b96;margin-bottom:12px">🗺️ طريق تعلم الحروف</div>'+levelGroups.map(function(g,idx){var done=0;for(var j=g.start;j<g.end;j++){if(learned.indexOf(j)>=0)done++;}var total=g.end-g.start,pct=Math.round(done/total*100),u=levelUnlocked(g);return '<div class="akxLevelCard '+(u?'':'locked')+'"><div class="akxLevelHead"><div><div class="akxLevelTitle">'+g.name+'</div><div style="font-weight:800;color:#607d8b">'+g.desc+'</div></div><div style="font-size:24px">'+(u?'🔓':'🔒')+'</div></div><div class="akxBar"><i style="width:'+pct+'%"></i></div><div style="font-weight:900;color:#37474f">'+done+' / '+total+' حروف ('+pct+'%)</div><button class="akxLevelBtn" data-level="'+idx+'" '+(u?'':'disabled')+'>'+(pct===100?'✅ مكتمل':'ابدأ المستوى')+'</button></div>';}).join('');content.querySelectorAll('[data-level]').forEach(function(b){b.onclick=function(){var g=levelGroups[+b.dataset.level];currentTab='learn';renderLearnRange(g.start,g.end);};});}
  function renderLearnRange(start,end){var g=levelGroups.filter(function(x){return x.start===start;})[0];content.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button id="akxBackLevels" class="akxBtn akxBlue">🗺️ المستويات</button><div style="font-weight:900;color:#075b96">📚 '+g.name+'</div></div><div id="akxCards">'+items.slice(start,end).map(function(_,k){return card(start+k);}).join('')+'</div>';content.querySelector('#akxBackLevels').onclick=function(){currentTab='levels';render();};bindCards();}
  function render(){progress(); if(currentTab==='home')renderHome(); else if(currentTab==='learn')renderLearn(); else if(currentTab==='levels')renderLevels(); else if(currentTab==='fav')renderFav(); else if(currentTab==='quiz')renderQuiz(); else if(currentTab==='game')renderGame(); else if(currentTab==='challenge')renderChallenge(); else if(currentTab==='badges')renderBadges(); else renderParent();}

  box.querySelector('#akxClose').onclick=function(){bg.style.display='none';if(window.AndroidTTS&&AndroidTTS.stop)AndroidTTS.stop();};
  launch.onclick=function(){bg.style.display='flex';render();};
  box.querySelectorAll('.akxTab').forEach(function(tab){tab.onclick=function(){currentTab=tab.dataset.tab;if(currentTab!=='parent')parentUnlocked=false;render();};});
  bg.addEventListener('click',function(e){if(e.target===bg){bg.style.display='none';if(window.AndroidTTS&&AndroidTTS.stop)AndroidTTS.stop();}});
  render();
</script></body></html>
